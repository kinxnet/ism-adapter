[project]
name = "ism-adapter"
version = "0.1.0"
description = "metering-api usage 데이터를 ISM(레거시 청구 시스템)으로 전달하는 어댑터"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.22",
    "pymysql>=1.1.0",
    "pydantic-settings>=2.0.3",
    "loguru>=0.7.2",
    "sentry-sdk[loguru]>=2.39.0",
    "hvac>=2.1.0",
    "httpx>=0.25.0",
    "arrow>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.14.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.15.7",
    "respx>=0.20.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (line-length로 관리)
]

[tool.ruff.lint.isort]
known-first-party = ["ism_adapter"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
